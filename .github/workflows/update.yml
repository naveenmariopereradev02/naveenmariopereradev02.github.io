name: Auto-Update Portfolio Projects & Languages

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'projects.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub repositories, READMEs, and languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/fetch-projects.js

      - name: Commit and push updated projects.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          if git diff --staged --quiet; then
            echo "No changes to projects.json"
          else
            git commit -m "chore: auto-update projects.json from GitHub repos [skip ci]"
            git push
          fi

